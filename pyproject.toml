[project]
name = "medbenchagent"
version = "0.1.0"
description = "MedD2B: supervised medical dataset-to-benchmark compilation."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Yulin Fu" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "httpx>=0.27.0",
    "filelock>=3.0.0",
    "langgraph>=1.2.9",
    "langchain-core>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "numpy>=2.2.6",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "rich>=15.0.0",
    "textual>=6.0.0",
    "tomlkit>=0.13.0",
    "langchain>=1.4.7,<1.5",
    "langchain-openai>=1.7.2,<1.8",
]

[project.optional-dependencies]
rag = ["chromadb>=0.5.0", "pypdf>=5.0.0"]
data-processing = [
    "pydicom==3.0.1", "nibabel==5.3.2", "pynrrd==1.1.3", "SimpleITK==2.5.3",
    "pylibjpeg==2.1.0", "pylibjpeg-libjpeg==2.3.0", "pylibjpeg-openjpeg==2.5.0",
]

[project.scripts]
medd2b = "medbenchagent.entrypoint:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medbenchagent"]

[tool.hatch.build.targets.wheel.force-include]
"src/medbenchagent/prompts/coding.md" = "medbenchagent/prompts/coding.md"
"src/medbenchagent/prompts/common.md" = "medbenchagent/prompts/common.md"
"src/medbenchagent/prompts/data_coding_handoff.md" = "medbenchagent/prompts/data_coding_handoff.md"
"src/medbenchagent/prompts/data_prepare.md" = "medbenchagent/prompts/data_prepare.md"
"src/medbenchagent/prompts/data_processing.md" = "medbenchagent/prompts/data_processing.md"
"src/medbenchagent/prompts/data_profile.md" = "medbenchagent/prompts/data_profile.md"
"src/medbenchagent/prompts/generation.md" = "medbenchagent/prompts/generation.md"
"src/medbenchagent/prompts/planner.md" = "medbenchagent/prompts/planner.md"
"src/medbenchagent/prompts/planner_design.md" = "medbenchagent/prompts/planner_design.md"
"src/medbenchagent/prompts/planner_discover.md" = "medbenchagent/prompts/planner_discover.md"
"src/medbenchagent/prompts/review.md" = "medbenchagent/prompts/review.md"
"src/medbenchagent/prompts/structured_repair.md" = "medbenchagent/prompts/structured_repair.md"
"src/medbenchagent/prompts/supervisor.md" = "medbenchagent/prompts/supervisor.md"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.3.0",
    "openpyxl==3.1.5",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
