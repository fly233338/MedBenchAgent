[project]
name = "medbenchagent"
version = "0.1.0"
description = "MedD2B: supervised medical dataset-to-benchmark compilation."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Yulin Fu" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "duckdb==1.5.4",
    "filelock>=3.0.0",
    "langgraph>=1.2.9",
    "langchain-core>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langsmith>=0.3.45,<1.0.0",
    "numpy>=2.2.6",
    "openai>=1.0.0",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "pypdf>=5.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "textual>=6.0.0",
    "tomlkit>=0.13.0",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
data-processing = [
    "pydicom==3.0.1", "nibabel==5.3.2", "pynrrd==1.1.3", "SimpleITK==2.5.3",
    "pylibjpeg==2.1.0", "pylibjpeg-libjpeg==2.3.0", "pylibjpeg-openjpeg==2.5.0",
]

[project.scripts]
medd2b = "medbenchagent.entrypoint:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medbenchagent"]

[tool.hatch.build.targets.wheel.force-include]
"src/medbenchagent/schemas/annotation.schema.json" = "medbenchagent/schemas/annotation.schema.json"
"src/medbenchagent/prompts/data_preparation_agent.md" = "medbenchagent/prompts/data_preparation_agent.md"
"src/medbenchagent/prompts/data_preparation_understand.md" = "medbenchagent/prompts/data_preparation_understand.md"
"src/medbenchagent/prompts/data_preparation_prepare_text.md" = "medbenchagent/prompts/data_preparation_prepare_text.md"
"src/medbenchagent/prompts/data_preparation_prepare_image.md" = "medbenchagent/prompts/data_preparation_prepare_image.md"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.3.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
