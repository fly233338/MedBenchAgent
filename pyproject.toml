[project]
name = "medbenchagent"
version = "0.1.0"
description = "An agent development project built with LangGraph."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Yulin Fu" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "chromadb>=0.5.0",
    "duckdb==1.5.4",
    "langgraph>=0.6.0",
    "langchain-core>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langsmith>=0.3.45,<1.0.0",
    "openai>=1.0.0",
    "pypdf>=5.0.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "qwen-vl-utils>=0.0.8",
    "sacrebleu>=2.4.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.66.0",
    "transformers>=4.51.0",
]

[project.scripts]
medbenchagent = "medbenchagent.cli:main"
medbench-eval = "medbenchagent.evaluation.eval:main"
medbench-infer = "medbenchagent.evaluation.inference:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medbenchagent"]

[tool.hatch.build.targets.wheel.force-include]
"src/medbenchagent/schemas/annotation.v2.schema.json" = "medbenchagent/schemas/annotation.v2.schema.json"
"src/medbenchagent/schemas/annotation.v3.schema.json" = "medbenchagent/schemas/annotation.v3.schema.json"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.3.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
