<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1400" height="1020" viewBox="0 0 1400 1020"
     role="img" aria-labelledby="title desc">
  <title id="title">Task examples</title>
  <desc id="desc">Eight benchmark task example cards with connector lines and blank square image placeholders.</desc>

  <defs>
    <style><![CDATA[
      .canvas { fill: #ffffff; }
      .left-panel { fill: #f7f8f9; stroke: #e0e4e7; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #a7adb2; stroke-width: 1.5; }
      .placeholder { fill: #f5f6f7; stroke: #b7bdc2; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .connector { fill: none; stroke: #42484d; stroke-width: 1.6; }
      .connector-dot { fill: #42484d; }
      .heading { font: 700 30px Arial, Helvetica, sans-serif; fill: #111315; }
      .task { font: 700 20px Arial, Helvetica, sans-serif; fill: #17191b; }
      .count { font: 400 18px Arial, Helvetica, sans-serif; fill: #17191b; }
      .body { font: 400 17px Arial, Helvetica, sans-serif; fill: #17191b; }
      .body-label { font-weight: 700; }
    ]]></style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1400" height="1020"/>
  <rect class="left-panel" x="0" y="70" width="146" height="890" rx="10"/>
  <text class="heading" x="194" y="52">Task examples</text>

  <!-- AA — BrEaST, audited task count: 200 -->
  <g id="aa" data-dataset="BrEaST" data-task="anatomy_attribute.tissue_composition">
    <line class="connector" x1="30" y1="132" x2="190" y2="132"/>
    <circle class="connector-dot" cx="190" cy="132" r="3.2"/>
    <rect class="card" x="190" y="80" width="1150" height="104" rx="8"/>
    <rect class="placeholder" x="525" y="94" width="76" height="76"/>
    <text class="task" x="208" y="117">AA — Anatomy attribute</text>
    <text class="count" x="208" y="157">200</text>
    <text class="body" x="645" y="117">
      <tspan class="body-label">Query:</tspan><tspan>&#160;What is the breast tissue composition as seen in this ultrasound image?</tspan>
    </text>
    <text class="body" x="645" y="150">
      <tspan class="body-label">Answer:</tspan><tspan>&#160;Homogeneous: fibroglandular</tspan>
    </text>
  </g>

  <!-- FT — VinDr, audited task count: 1,226 -->
  <g id="ft" data-dataset="VinDr" data-task="finding_type">
    <line class="connector" x1="30" y1="244" x2="190" y2="244"/>
    <circle class="connector-dot" cx="190" cy="244" r="3.2"/>
    <rect class="card" x="190" y="192" width="1150" height="104" rx="8"/>
    <rect class="placeholder" x="525" y="206" width="76" height="76"/>
    <text class="task" x="208" y="229">FT — Finding type</text>
    <text class="count" x="208" y="269">1,226</text>
    <text class="body" x="645" y="229">
      <tspan class="body-label">Query:</tspan><tspan>&#160;What type of finding does this mammogram show?</tspan>
    </text>
    <text class="body" x="645" y="262">
      <tspan class="body-label">Answer:</tspan><tspan>&#160;Mass</tspan>
    </text>
  </g>

  <!-- FA — BrEaST, audited parent-task count: 1,731 -->
  <g id="fa" data-dataset="BrEaST" data-task="finding_attribute.shape">
    <line class="connector" x1="30" y1="356" x2="190" y2="356"/>
    <circle class="connector-dot" cx="190" cy="356" r="3.2"/>
    <rect class="card" x="190" y="304" width="1150" height="104" rx="8"/>
    <rect class="placeholder" x="525" y="318" width="76" height="76"/>
    <text class="task" x="208" y="341">FA — Finding attribute</text>
    <text class="count" x="208" y="381">1,731</text>
    <text class="body" x="645" y="341">
      <tspan class="body-label">Query:</tspan><tspan>&#160;What is the shape of the mass observed on the ultrasound?</tspan>
    </text>
    <text class="body" x="645" y="374">
      <tspan class="body-label">Answer:</tspan><tspan>&#160;Irregular</tspan>
    </text>
  </g>

  <!-- AC — BUS-BRA, audited task count: 1,250 -->
  <g id="ac" data-dataset="BUS-BRA" data-task="assessment_category">
    <line class="connector" x1="30" y1="468" x2="190" y2="468"/>
    <circle class="connector-dot" cx="190" cy="468" r="3.2"/>
    <rect class="card" x="190" y="416" width="1150" height="104" rx="8"/>
    <rect class="placeholder" x="525" y="430" width="76" height="76"/>
    <text class="task" x="208" y="453">AC — Assessment category</text>
    <text class="count" x="208" y="493">1,250</text>
    <text class="body" x="645" y="453">
      <tspan class="body-label">Query:</tspan><tspan>&#160;Which BI-RADS category applies to this breast ultrasound finding?</tspan>
    </text>
    <text class="body" x="645" y="486">
      <tspan class="body-label">Answer:</tspan><tspan>&#160;BI-RADS 3: Probably Benign</tspan>
    </text>
  </g>

  <!-- DX — BUS-BRA, audited task count: 1,250 -->
  <g id="dx" data-dataset="BUS-BRA" data-task="diagnosis">
    <line class="connector" x1="30" y1="580" x2="190" y2="580"/>
    <circle class="connector-dot" cx="190" cy="580" r="3.2"/>
    <rect class="card" x="190" y="528" width="1150" height="104" rx="8"/>
    <rect class="placeholder" x="525" y="542" width="76" height="76"/>
    <text class="task" x="208" y="565">DX — Diagnosis</text>
    <text class="count" x="208" y="605">1,250</text>
    <text class="body" x="645" y="565">
      <tspan class="body-label">Query:</tspan><tspan>&#160;What histologic diagnosis is most consistent with this ultrasound finding?</tspan>
    </text>
    <text class="body" x="645" y="598">
      <tspan class="body-label">Answer:</tspan><tspan>&#160;Cyst</tspan>
    </text>
  </g>

  <!-- PS — BrEaST, audited task count: 256 -->
  <g id="ps" data-dataset="BrEaST" data-task="pathology_status">
    <line class="connector" x1="30" y1="692" x2="190" y2="692"/>
    <circle class="connector-dot" cx="190" cy="692" r="3.2"/>
    <rect class="card" x="190" y="640" width="1150" height="104" rx="8"/>
    <rect class="placeholder" x="525" y="654" width="76" height="76"/>
    <text class="task" x="208" y="677">PS — Pathology status</text>
    <text class="count" x="208" y="717">256</text>
    <text class="body" x="645" y="677">
      <tspan class="body-label">Query:</tspan><tspan>&#160;Classify this breast lesion seen on ultrasound:</tspan>
    </text>
    <text class="body" x="645" y="710">
      <tspan class="body-label">Answer:</tspan><tspan>&#160;Benign</tspan>
    </text>
  </g>

  <!-- Detection — VinDr, audited task count: 1,229 -->
  <g id="detection" data-dataset="VinDr" data-task="detection">
    <line class="connector" x1="30" y1="804" x2="190" y2="804"/>
    <circle class="connector-dot" cx="190" cy="804" r="3.2"/>
    <rect class="card" x="190" y="752" width="1150" height="104" rx="8"/>
    <rect class="placeholder" x="525" y="766" width="76" height="76"/>
    <text class="task" x="208" y="789">Det — Detection</text>
    <text class="count" x="208" y="829">1,229</text>
    <text class="body" x="645" y="779">
      <tspan class="body-label">Query:</tspan><tspan>&#160;Where is the suspicious region located in this</tspan>
      <tspan x="645" dy="21">mammogram? Please draw a bounding box around it.</tspan>
    </text>
    <text class="body" x="645" y="833">
      <tspan class="body-label">Answer:</tspan><tspan>&#160;[1298.21, 1479.98, 1625.63, 1773.81]</tspan>
    </text>
  </g>

  <!-- VG — VinDr, audited task count: 1,229 -->
  <g id="visual-grounding" data-dataset="VinDr" data-task="visual_grounding">
    <line class="connector" x1="30" y1="916" x2="190" y2="916"/>
    <circle class="connector-dot" cx="190" cy="916" r="3.2"/>
    <rect class="card" x="190" y="864" width="1150" height="104" rx="8"/>
    <rect class="placeholder" x="525" y="878" width="76" height="76"/>
    <text class="task" x="208" y="901">VG — Visual grounding</text>
    <text class="count" x="208" y="941">1,229</text>
    <text class="body" x="645" y="901">
      <tspan class="body-label">Query:</tspan><tspan>&#160;Can you draw a bounding box around the Mass in this mammogram?</tspan>
    </text>
    <text class="body" x="645" y="934">
      <tspan class="body-label">Answer:</tspan><tspan>&#160;[1020.48, 1275.31, 1209.85, 1437.63]</tspan>
    </text>
  </g>
</svg>
