<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1312" height="644" viewBox="0 0 1312 644"
     role="img" aria-labelledby="title desc">
  <title id="title">AuditAgent: Quality Audit and Post-processing</title>
  <desc id="desc">A vector recreation of two AuditAgent stages: quality audit of generated benchmark items followed by post-processing and answer balancing.</desc>

  <defs>
    <linearGradient id="outerFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffefe"/>
      <stop offset="1" stop-color="#fffdfc"/>
    </linearGradient>
    <linearGradient id="paperFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfcfc"/>
    </linearGradient>
    <linearGradient id="imageFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#d6e5f2"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9f3029"/>
      <stop offset="0.55" stop-color="#c2473e"/>
      <stop offset="1" stop-color="#d36a5e"/>
    </linearGradient>
    <linearGradient id="paleRedBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7a09a"/>
      <stop offset="1" stop-color="#f3cfcc"/>
    </linearGradient>
    <linearGradient id="greenA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#315f32"/>
      <stop offset="1" stop-color="#5e8d5d"/>
    </linearGradient>
    <linearGradient id="greenB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8c5a"/>
      <stop offset="1" stop-color="#86ad7d"/>
    </linearGradient>
    <linearGradient id="greenC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8cb785"/>
      <stop offset="1" stop-color="#b4d19f"/>
    </linearGradient>
    <linearGradient id="greenD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9d7a7"/>
      <stop offset="1" stop-color="#d9eac9"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ffe9"/>
      <stop offset="1" stop-color="#d9efd2"/>
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="3" dy="5" result="offsetBlur"/>
      <feFlood flood-color="#6d6d6d" flood-opacity="0.25" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-15%" y="-15%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#6d6d6d" flood-opacity="0.18" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L12 6 L0 12 Z" fill="#5c6263"/>
    </marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a8abad"/>
    </marker>
    <marker id="arrowCircle" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4f5556"/>
    </marker>
    <symbol id="checkBox" viewBox="0 0 38 38">
      <rect x="2" y="2" width="34" height="34" rx="7" fill="#fbfff9" stroke="#548855" stroke-width="3"/>
      <path d="M10 19.5 16.5 26 29 12" fill="none" stroke="#477c49" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <!-- warm paper-like canvas -->
  <rect width="1312" height="644" fill="#ffffff"/>
  <rect x="27" y="10" width="1258" height="615" rx="39" fill="url(#outerFill)" stroke="#b95d54" stroke-width="2.6" filter="url(#cardShadow)"/>

  <!-- parent title retained from the reference composition -->
  <text x="656" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#9b2922">AuditAgent</text>

  <!-- Quality Audit panel -->
  <g id="quality-audit">
    <rect x="68" y="117" width="544" height="461" rx="31" fill="#fffefe" stroke="#e3a2a0" stroke-width="2.5" filter="url(#softShadow)"/>
    <text x="340" y="173" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#a02c25">Quality Audit</text>

    <!-- main checked document -->
    <g filter="url(#cardShadow)">
      <rect x="107" y="210" width="247" height="340" rx="28" fill="url(#paperFill)" stroke="#777d7f" stroke-width="2.5"/>
      <rect x="132" y="239" width="85" height="88" rx="8" fill="url(#imageFill)" stroke="#aeb7bd" stroke-width="2.2"/>
      <circle cx="158" cy="263" r="10" fill="#9eb7d0"/>
      <path d="M136 310 158 287 174 301 190 284 214 311v14h-78Z" fill="#577ca7"/>
      <path d="M136 302 158 281 174 294 190 279 214 304" fill="none" stroke="#7295bd" stroke-width="2" opacity=".45"/>

      <rect x="240" y="249" width="79" height="10" rx="5" fill="#d7d9d9"/>
      <rect x="240" y="270" width="85" height="10" rx="5" fill="#d7d9d9"/>
      <rect x="240" y="291" width="57" height="10" rx="5" fill="#e1e2e2"/>

      <use xlink:href="#checkBox" x="132" y="356" width="38" height="38"/>
      <rect x="186" y="365" width="130" height="9" rx="4.5" fill="#dedfdf"/>
      <rect x="186" y="383" width="80" height="9" rx="4.5" fill="#eeeeee"/>
      <use xlink:href="#checkBox" x="132" y="418" width="38" height="38"/>
      <rect x="186" y="427" width="139" height="9" rx="4.5" fill="#dedfdf"/>
      <rect x="186" y="445" width="72" height="9" rx="4.5" fill="#eeeeee"/>
      <use xlink:href="#checkBox" x="132" y="480" width="38" height="38"/>
      <rect x="186" y="489" width="132" height="9" rx="4.5" fill="#dedfdf"/>
      <rect x="186" y="507" width="64" height="9" rx="4.5" fill="#eeeeee"/>
    </g>

    <!-- magnifying glass over the audit document -->
    <g>
      <circle cx="296" cy="350" r="51" fill="#ffffff" fill-opacity=".78" stroke="#8d1f1b" stroke-width="6"/>
      <circle cx="296" cy="350" r="44" fill="#eef8ff" fill-opacity=".65" stroke="#cf7870" stroke-width="2"/>
      <path d="M265 327c17-14 45-13 61 2" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".78"/>
      <path d="M332 391 371 430" stroke="#8d1f1b" stroke-width="15" stroke-linecap="round"/>
      <path d="M332 391 371 430" stroke="#c06a60" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- rejected / screened item card -->
    <g opacity=".54">
      <rect x="441" y="224" width="128" height="160" rx="16" fill="#fcfcfc" stroke="#aeb2b2" stroke-width="2.2"/>
      <rect x="455" y="242" width="42" height="44" rx="5" fill="#f3f4f4" stroke="#c1c5c5" stroke-width="1.8"/>
      <circle cx="468" cy="254" r="5" fill="#c5c9c9"/>
      <path d="M458 277 469 266 478 273 487 264 496 279v7h-38Z" fill="#b8bdbd"/>
      <rect x="509" y="247" width="46" height="6" rx="3" fill="#bfc2c2"/>
      <rect x="509" y="261" width="53" height="6" rx="3" fill="#c8cbcb"/>
      <rect x="509" y="275" width="38" height="6" rx="3" fill="#d4d6d6"/>
      <rect x="455" y="306" width="98" height="7" rx="3.5" fill="#d0d2d2"/>
      <rect x="455" y="323" width="78" height="7" rx="3.5" fill="#dbdddd"/>
      <rect x="455" y="340" width="91" height="7" rx="3.5" fill="#d0d2d2"/>
      <rect x="455" y="357" width="52" height="7" rx="3.5" fill="#dbdddd"/>
    </g>
    <path d="M356 303 H436" fill="none" stroke="#8f9495" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrowLight)"/>
    <circle cx="558" cy="370" r="24" fill="#fffafa" stroke="#cf7269" stroke-width="2.5"/>
    <path d="M548 360 568 380M568 360 548 380" stroke="#c35b54" stroke-width="4" stroke-linecap="round"/>

    <!-- green approval shield -->
    <g filter="url(#softShadow)">
      <path d="M459 425 508 447v34c0 34-21 57-49 67-28-10-49-33-49-67v-34Z" fill="url(#shieldFill)" stroke="#5a8956" stroke-width="3"/>
      <path d="M459 434 499 452v28c0 27-16 45-40 55-24-10-40-28-40-55v-28Z" fill="none" stroke="#a5c99e" stroke-width="2"/>
      <path d="M436 490 452 506 484 469" fill="none" stroke="#4d804b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- stage transition arrow -->
  <path d="M614 318 H684" fill="none" stroke="#606667" stroke-width="4" marker-end="url(#arrowDark)"/>

  <!-- Post-processing panel -->
  <g id="post-processing">
    <rect x="687" y="117" width="551" height="461" rx="31" fill="#fffefe" stroke="#e3a2a0" stroke-width="2.5" filter="url(#softShadow)"/>
    <text x="962.5" y="173" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#a02c25">Post-processing</text>

    <!-- pre-processing distribution: descending red bars -->
    <g>
      <rect x="720" y="250" width="35" height="216" rx="4" fill="url(#redBar)" stroke="#9b302a" stroke-width="2"/>
      <rect x="769" y="356" width="35" height="110" rx="4" fill="url(#paleRedBar)" stroke="#d99a94" stroke-width="2"/>
      <rect x="818" y="409" width="35" height="57" rx="4" fill="url(#paleRedBar)" stroke="#e0b1ad" stroke-width="2"/>
      <rect x="867" y="436" width="35" height="30" rx="4" fill="url(#paleRedBar)" stroke="#e4c2be" stroke-width="2"/>
      <text x="737.5" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#4e5354">A</text>
      <text x="786.5" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#4e5354">B</text>
      <text x="835.5" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#4e5354">C</text>
      <text x="884.5" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#4e5354">D</text>
    </g>

    <!-- central re-balancing loop -->
    <g>
      <path d="M910 345 C919 315 949 304 974 318 C983 323 991 331 996 341" fill="none" stroke="#4e5556" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowCircle)"/>
      <path d="M998 369 C988 397 958 407 934 394 C924 389 916 382 910 373" fill="none" stroke="#4e5556" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowCircle)"/>
      <path d="M988 353 1014 352 1033 362 1011 375Z" fill="#e1e3e3" opacity=".72"/>
    </g>

    <!-- post-processing distribution: balanced green bars -->
    <g>
      <rect x="1028" y="329" width="36" height="137" rx="4" fill="url(#greenA)" stroke="#315b32" stroke-width="2"/>
      <rect x="1077" y="330" width="36" height="136" rx="4" fill="url(#greenB)" stroke="#65915d" stroke-width="2"/>
      <rect x="1126" y="330" width="36" height="136" rx="4" fill="url(#greenC)" stroke="#8cb57d" stroke-width="2"/>
      <rect x="1175" y="330" width="36" height="136" rx="4" fill="url(#greenD)" stroke="#a7c893" stroke-width="2"/>
      <text x="1046" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#4e5354">A</text>
      <text x="1095" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#4e5354">B</text>
      <text x="1144" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#4e5354">C</text>
      <text x="1193" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#4e5354">D</text>
    </g>
  </g>
</svg>
