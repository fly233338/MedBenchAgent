<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">MedBenchAgent current agent architecture</title>
  <desc id="desc">The current LangGraph planning workflow, its inputs, runtime dependencies, review loops, artifacts, and the not-yet-implemented generation boundary.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#e11d48"/>
    </marker>
    <style>
      .title { font: 700 30px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .section { font: 700 16px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .stage { font: 700 13px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .node-title { font: 700 14px "Segoe UI", Arial, sans-serif; }
      .node-sub { font: 400 11px "Segoe UI", Arial, sans-serif; }
      .small { font: 500 11px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .edge { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .edge-green { fill: none; stroke: #059669; stroke-width: 2; marker-end: url(#arrow-green); }
      .edge-orange { fill: none; stroke: #ea580c; stroke-width: 2; marker-end: url(#arrow-orange); }
      .edge-purple { fill: none; stroke: #7c3aed; stroke-width: 1.5; stroke-dasharray: 5 5; marker-end: url(#arrow); }
      .edge-red { fill: none; stroke: #e11d48; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-red); }
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 1; rx: 12; }
      .stage-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 10; }
      .green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
      .purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.5; }
      .orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; }
      .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .slate { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
      .red { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="40" y="56" class="title">MedBenchAgent · 当前 Agent 架构</text>
  <text x="40" y="84" class="subtitle">Planning-only · LangGraph orchestration · deterministic profiling · LLM-assisted screening · PDF RAG · human review loops</text>
  <rect x="1320" y="32" width="210" height="38" rx="19" fill="#0f172a"/>
  <text x="1425" y="56" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#fff">CURRENT / AS-IS</text>

  <g transform="translate(40,105)">
    <rect width="112" height="30" rx="15" class="green"/><text x="56" y="20" text-anchor="middle" class="small" fill="#065f46">确定性代码</text>
    <rect x="124" width="112" height="30" rx="15" class="purple"/><text x="180" y="20" text-anchor="middle" class="small" fill="#5b21b6">LLM / RAG</text>
    <rect x="248" width="112" height="30" rx="15" class="orange"/><text x="304" y="20" text-anchor="middle" class="small" fill="#9a3412">人工确认</text>
    <rect x="372" width="150" height="30" rx="15" class="red"/><text x="447" y="20" text-anchor="middle" class="small" fill="#9f1239">协议占位 / 未实现</text>
  </g>

  <rect x="40" y="155" width="210" height="665" class="panel" fill="#f8fafc"/>
  <text x="60" y="190" class="section">输入与操作者</text>
  <text x="60" y="208" class="small">Inputs &amp; review</text>

  <g filter="url(#shadow)">
    <rect x="60" y="235" width="170" height="78" rx="12" class="blue"/>
    <text x="145" y="264" text-anchor="middle" class="node-title" fill="#1e3a8a">自然语言需求</text>
    <text x="145" y="285" text-anchor="middle" class="node-sub" fill="#1e3a8a">疾病 · 模态 · 语言</text>
    <text x="145" y="301" text-anchor="middle" class="node-sub" fill="#1e3a8a">数量 · 目标</text>

    <rect x="60" y="335" width="170" height="72" rx="12" class="slate"/>
    <text x="145" y="365" text-anchor="middle" class="node-title" fill="#334155">静态任务 Blueprint</text>
    <text x="145" y="386" text-anchor="middle" class="node-sub" fill="#475569">16 类医疗 VLM task</text>

    <rect x="60" y="430" width="170" height="76" rx="12" class="green"/>
    <text x="145" y="461" text-anchor="middle" class="node-title" fill="#065f46">annotation.jsonl</text>
    <text x="145" y="482" text-anchor="middle" class="node-sub" fill="#065f46">image-centric v2</text>

    <rect x="60" y="610" width="170" height="76" rx="12" class="purple"/>
    <text x="145" y="641" text-anchor="middle" class="node-title" fill="#5b21b6">医学 PDF 目录</text>
    <text x="145" y="662" text-anchor="middle" class="node-sub" fill="#5b21b6">指南 / 参考材料</text>

    <rect x="60" y="716" width="170" height="76" rx="12" class="orange"/>
    <text x="145" y="747" text-anchor="middle" class="node-title" fill="#9a3412">Human reviewer</text>
    <text x="145" y="768" text-anchor="middle" class="node-sub" fill="#9a3412">3 类审批回路 + 路径输入</text>
  </g>

  <rect x="275" y="155" width="960" height="665" class="panel"/>
  <text x="295" y="190" class="section">LangGraph 控制平面</text>
  <text x="295" y="208" class="small">BenchmarkState checkpoint：紧凑摘要 + artifact path</text>

  <rect x="295" y="225" width="920" height="142" class="stage-bg"/>
  <text x="310" y="252" class="stage">01 · 需求结构化</text>
  <rect x="325" y="270" width="185" height="74" rx="12" class="purple"/>
  <text x="417" y="298" text-anchor="middle" class="node-title" fill="#5b21b6">BenchmarkInfo 提取</text>
  <text x="417" y="318" text-anchor="middle" class="node-sub" fill="#5b21b6">benchmark_extract · LLM JSON</text>
  <rect x="570" y="270" width="170" height="74" rx="12" class="orange"/>
  <text x="655" y="298" text-anchor="middle" class="node-title" fill="#9a3412">需求确认</text>
  <text x="655" y="318" text-anchor="middle" class="node-sub" fill="#9a3412">benchmark_confirm · interrupt</text>
  <rect x="825" y="270" width="205" height="74" rx="8" class="slate"/>
  <text x="927" y="298" text-anchor="middle" class="node-title" fill="#334155">Working Blueprint</text>
  <text x="927" y="318" text-anchor="middle" class="node-sub" fill="#475569">runs/{run_id}/blueprint.json</text>

  <path d="M230 274 H325" class="edge"/>
  <path d="M510 307 H570" class="edge"/>
  <path d="M740 307 H825" class="edge-green"/>
  <path d="M655 270 V250 H417 V270" class="edge-orange"/>
  <text x="535" y="243" class="small" fill="#9a3412">correction loop</text>

  <rect x="295" y="382" width="920" height="220" class="stage-bg"/>
  <text x="310" y="409" class="stage">02 · 数据能力识别与任务筛选</text>
  <rect x="320" y="435" width="190" height="82" rx="12" class="green"/>
  <text x="415" y="465" text-anchor="middle" class="node-title" fill="#065f46">校验 + 数据剖析</text>
  <text x="415" y="485" text-anchor="middle" class="node-sub" fill="#065f46">no image access / no LLM</text>
  <rect x="545" y="435" width="190" height="82" rx="12" class="purple"/>
  <text x="640" y="465" text-anchor="middle" class="node-title" fill="#5b21b6">完整 Task Plan</text>
  <text x="640" y="485" text-anchor="middle" class="node-sub" fill="#5b21b6">LLM + contract validation</text>
  <rect x="770" y="435" width="190" height="82" rx="12" class="orange"/>
  <text x="865" y="465" text-anchor="middle" class="node-title" fill="#9a3412">Task Plan 审核</text>
  <text x="865" y="485" text-anchor="middle" class="node-sub" fill="#9a3412">confirm / revise one task</text>
  <rect x="1000" y="435" width="185" height="82" rx="12" class="green"/>
  <text x="1092" y="465" text-anchor="middle" class="node-title" fill="#065f46">应用已确认计划</text>
  <text x="1092" y="485" text-anchor="middle" class="node-sub" fill="#065f46">retain / drop</text>
  <rect x="770" y="535" width="190" height="54" rx="12" class="purple"/>
  <text x="865" y="559" text-anchor="middle" class="node-title" fill="#5b21b6">单任务修订</text>
  <text x="865" y="576" text-anchor="middle" class="node-sub" fill="#5b21b6">replace one entry</text>
  <rect x="320" y="535" width="415" height="36" rx="18" fill="#fff" stroke="#94a3b8"/>
  <text x="527" y="558" text-anchor="middle" class="small">DuckDB · dataset_profile.json · access_manifest.json</text>
  <rect x="990" y="535" width="205" height="48" rx="18" fill="#fff" stroke="#94a3b8"/>
  <text x="1092" y="555" text-anchor="middle" class="small">task_plan_report.json</text>
  <text x="1092" y="571" text-anchor="middle" class="small">+ mutated Blueprint</text>

