  <text x="310" y="644" class="stage">03 · 医学依据增强与生成请求组装</text>
  <rect x="315" y="675" width="150" height="72" rx="12" class="orange"/>
  <text x="390" y="704" text-anchor="middle" class="node-title" fill="#9a3412">材料目录确认</text>
  <text x="390" y="724" text-anchor="middle" class="node-sub" fill="#9a3412">interrupt</text>
  <rect x="490" y="675" width="165" height="72" rx="12" class="purple"/>
  <text x="572" y="704" text-anchor="middle" class="node-title" fill="#5b21b6">LocalPdfRag</text>
  <text x="572" y="724" text-anchor="middle" class="node-sub" fill="#5b21b6">rag_design · PyPDF → Chroma</text>
  <rect x="680" y="675" width="170" height="72" rx="12" class="purple"/>
  <text x="765" y="704" text-anchor="middle" class="node-title" fill="#5b21b6">题型设计</text>
  <text x="765" y="724" text-anchor="middle" class="node-sub" fill="#5b21b6">rag_design · 1 LLM call / task</text>
  <rect x="875" y="675" width="140" height="72" rx="12" class="orange"/>
  <text x="945" y="704" text-anchor="middle" class="node-title" fill="#9a3412">设计确认</text>
  <text x="945" y="724" text-anchor="middle" class="node-sub" fill="#9a3412">interrupt</text>
  <rect x="1040" y="675" width="155" height="72" rx="12" class="blue" stroke-width="2"/>
  <text x="1117" y="704" text-anchor="middle" class="node-title" fill="#1e3a8a">GenerationRequest</text>
  <text x="1117" y="724" text-anchor="middle" class="node-sub" fill="#1e3a8a">ready = true</text>
  <rect x="620" y="759" width="395" height="28" rx="14" fill="#fff" stroke="#94a3b8"/>
  <text x="817" y="778" text-anchor="middle" class="small">templates · bindings · answers · rules · PDF citations</text>

  <path d="M230 648 H315" class="edge"/>
  <path d="M465 711 H490" class="edge"/>
  <path d="M655 711 H680" class="edge"/>
  <path d="M850 711 H875" class="edge"/>
  <path d="M1015 711 H1040" class="edge-green"/>
  <path d="M945 675 V658 H765 V675" class="edge-orange"/>

  <rect x="1260" y="155" width="300" height="665" class="panel" fill="#f8fafc"/>
  <text x="1280" y="190" class="section">模型、存储与约束</text>
  <text x="1280" y="208" class="small">Runtime dependencies</text>
  <rect x="1285" y="245" width="250" height="88" rx="12" class="purple"/>
  <text x="1410" y="275" text-anchor="middle" class="node-title" fill="#5b21b6">Discovered Chat model</text>
  <text x="1410" y="296" text-anchor="middle" class="node-sub" fill="#5b21b6">OpenAI-compatible vLLM</text>
  <text x="1410" y="312" text-anchor="middle" class="node-sub" fill="#5b21b6">temperature 0 · JSON mode</text>
  <rect x="1285" y="395" width="250" height="88" rx="12" class="green"/>
  <text x="1410" y="425" text-anchor="middle" class="node-title" fill="#065f46">Content-addressed cache</text>
  <text x="1410" y="446" text-anchor="middle" class="node-sub" fill="#065f46">SHA-256 + format version</text>
  <text x="1410" y="462" text-anchor="middle" class="node-sub" fill="#065f46">DuckDB / JSON artifacts</text>
  <rect x="1285" y="555" width="250" height="88" rx="12" class="purple"/>
  <text x="1410" y="585" text-anchor="middle" class="node-title" fill="#5b21b6">Local retrieval stack</text>
  <text x="1410" y="606" text-anchor="middle" class="node-sub" fill="#5b21b6">Embedding · Reranker</text>
  <text x="1410" y="622" text-anchor="middle" class="node-sub" fill="#5b21b6">Chroma persistent index</text>
  <rect x="1285" y="690" width="250" height="92" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="1410" y="720" text-anchor="middle" class="node-title" fill="#92400e">当前工作区运行条件</text>
  <text x="1410" y="743" text-anchor="middle" class="node-sub" fill="#92400e">materials/ 与 models/ 为空</text>
  <text x="1410" y="760" text-anchor="middle" class="node-sub" fill="#92400e">完整 RAG 路径尚不能本地复现</text>

  <path d="M1285 289 H1218 V307 H510" class="edge-purple"/>
  <path d="M1285 439 H1218 V476 H1185" class="edge-purple"/>
  <path d="M1285 599 H1218 V711 H655" class="edge-purple"/>

