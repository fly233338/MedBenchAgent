dataset_sources = []

[benchmark]
default_sample_count = 1000
input_policy = "image-only"

[planning]
novelty_enabled = false

[paths]
dataset_catalog = "datasets/dataset_catalog.json"
bir_template = "config/bir_template"
materials_root = "materials"
runs_root = ".runtime"
prepared_datasets_root = "datasets/Prepared"

[llm]
model = ""
base_url = "http://127.0.0.1:8005/v1"
timeout_seconds = 300
max_retries = 0
default_temperature = 0.0
# OpenHands SDK 1.49.6 defaults to "high". Set this explicitly because
# reasoning levels are gateway/model specific (the default gateway accepts medium).
reasoning_effort = "medium"

[rag]
embedding_base_url = "http://127.0.0.1:8006/v1"
embedding_model = ""
reranker_base_url = "http://127.0.0.1:8007/v1"
reranker_model = ""
chunk_size = 1200
chunk_overlap = 200
candidate_count = 12
result_limit = 5
min_rerank_score = 0.5
reranker_max_length = 8192

[generation]
seed = 0
max_tasks_per_image = 20
# Per response format. Optional total across all formats (unset means no total limit):
# max_total_tasks_per_image = 1
question_temperature = 0.7
fetch_batch_size = 128
# Number of semantically equivalent question templates per Leaf Task (3-5).
question_template_count = 3

[dataset_profile]
max_top_values = 3
max_top_value_chars = 200

[harness]
max_calls = 60
max_seconds = 7200
max_failures = 3
max_reworks = 3

[data_processing]
backend = "local"
image = "medbench-data:local"
timeout_seconds = 1200
memory_limit = "1GB"
threads = 2
container_memory = "4g"
source_workspace_mode = "readonly_mount"
coding_worker_image = "medbench-openhands:local"
coding_worker_venv = ".venv-coding"
coding_worker_max_iterations = 100
coding_worker_timeout_seconds = 7200
preparation_attempt_limits = { understand = 2, prepare = 2, mapping_revision_cycles = 1 }
preparation_stage_budgets = { understand = { max_iterations = 40, timeout_seconds = 1800 }, prepare = { max_iterations = 80, timeout_seconds = 3600 } }
