dataset_sources = []

[benchmark]
default_sample_count = 1000
default_language = "en"
input_policy = "image-only"

[planning]
max_calls = 1200
context_chars = 64000

[supervisor]
context_chars = 64000
artifact_chars = 4000
max_artifacts = 4
history_items = 8
catalog_page_size = 20
max_lookups = 4

[supervisor.loop]
max_model_calls = 12
max_tool_calls = 4
context_tokens = 24000
max_output_tokens = 4096
summary_trigger_tokens = 8000
summary_keep_tokens = 2000

[planner]
context_chars = 96000
page_size = 20
preview_chars = 6000
max_scenarios = 10000

[planner.loop]
max_model_calls = 60
max_tool_calls = 120
context_tokens = 32000
max_output_tokens = 4096
summary_trigger_tokens = 12000
summary_keep_tokens = 3000

[coding]
worker_venv = ".venv-coding"
max_iterations = 80
timeout_seconds = 3600
max_output_tokens = 4096
condenser_max_events = 80
condenser_max_tokens = 24000

[data_processing_agent]
context_chars = 128000
page_size = 20
preview_chars = 6000
[data_processing_agent.loop]
max_model_calls = 40
max_tool_calls = 80
context_tokens = 40000
max_output_tokens = 4096
summary_trigger_tokens = 18000
summary_keep_tokens = 4000

[generation_agent]
context_chars = 96000
page_size = 64
preview_chars = 6000
[generation_agent.loop]
max_model_calls = 60
max_tool_calls = 120
context_tokens = 32000
max_output_tokens = 4096
summary_trigger_tokens = 12000
summary_keep_tokens = 3000

[review_agent]
context_chars = 96000
page_size = 20
preview_chars = 6000
[review_agent.loop]
max_model_calls = 40
max_tool_calls = 80
context_tokens = 32000
max_output_tokens = 4096
summary_trigger_tokens = 12000
summary_keep_tokens = 3000

# Omitted fields inherit the resolved [llm], including its environment overrides.
[coding.llm]

[paths]
dataset_catalog = "datasets/dataset_catalog.json"
bir_template = "config/bir_template"
materials_root = "materials"
runs_root = ".runtime"
prepared_datasets_root = "datasets/Prepared"

[llm]
model = ""
base_url = "http://127.0.0.1:8005/v1"
timeout_seconds = 300
max_retries = 0
default_temperature = 0.0
# OpenHands SDK 1.49.6 defaults to "high". Set this explicitly because
# reasoning levels are gateway/model specific (the default gateway accepts medium).
reasoning_effort = "medium"

[rag]
embedding_base_url = "http://127.0.0.1:8006/v1"
embedding_model = ""
reranker_base_url = "http://127.0.0.1:8007/v1"
reranker_model = ""
chunk_size = 1200
chunk_overlap = 200
candidate_count = 12
result_limit = 5
min_rerank_score = 0.5
reranker_max_length = 8192

[generation]
seed = 0
max_tasks_per_image = 20
# Per response format. Optional total across all formats (unset means no total limit):
# max_total_tasks_per_image = 1
fetch_batch_size = 128
# Number of semantically equivalent question templates per Leaf Task (3-5).
question_template_count = 3

[harness]
max_calls = 60
max_seconds = 7200
max_failures = 3
max_reworks = 3

[data_processing]
backend = "local"
coding_worker_image = "medbench-openhands:local"
coding_worker_venv = ".venv-coding"
preparation_attempt_limits = { understand = 2, prepare_text = 2, prepare_image = 2, mapping_revision_cycles = 1 }
preparation_stage_budgets = { understand = { max_iterations = 80, timeout_seconds = 1800, condenser_max_events = 80, condenser_max_tokens = 24000 }, prepare_text = { max_iterations = 80, timeout_seconds = 3600, condenser_max_events = 80, condenser_max_tokens = 24000 }, prepare_image = { max_iterations = 80, timeout_seconds = 3600, condenser_max_events = 80, condenser_max_tokens = 24000 } }
