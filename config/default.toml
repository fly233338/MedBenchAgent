[paths]
dataset_catalog = "datasets/dataset_catalog.json"
blueprint_template = "config/blueprint.json"
materials_root = "materials"
runs_root = "benchmarks/runs"

[llm]
model = "deepseek-v4-flash"
base_url = "http://127.0.0.1:8005/v1"
timeout_seconds = 120
max_retries = 0
default_temperature = 0.0
trace_name = "DeepSeek"

[rag]
embedding_model = ""
reranker_model = ""
chunk_size = 1200
chunk_overlap = 200
candidate_count = 12
result_limit = 5
min_rerank_score = 0.5
reranker_max_length = 8192

[generation]
seed = 0
max_tasks_per_image = 20
question_temperature = 0.7
fetch_batch_size = 128
question_template_count = 3

[dataset_profile]
max_top_values = 3
max_top_value_chars = 200

[sample_allocation.category_weights]
image_acquisition_and_basic_information = 0.10
anatomy_and_global_tissue_characteristics = 0.20
finding_recognition_and_characterization = 0.20
clinical_assessment_and_diagnosis = 0.20
report_generation = 0.10
spatial_localization = 0.20

[harness]
max_calls = 60
max_seconds = 3600
max_failures = 3
max_reworks = 3

[data_processing]
image = "medbench-data:local"
timeout_seconds = 600
